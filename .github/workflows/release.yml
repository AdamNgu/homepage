name: Release

# Registry-less flow: the image travels as a pipeline artifact (build once,
# promote the exact artifact). No registry access is needed anywhere — the
# server never talks to GHCR/docker.io at deploy time. When a registry is
# procured, restore the login/metadata-action/push steps (see git history,
# GHCR flow through commit ccfccda) and point the unit files back at it.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Native arm64 build (no QEMU) — matches the RHEL-family arm64 servers.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Buildx is still required for type=gha layer caching.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          tags: localhost/homepage:latest
          outputs: type=oci,dest=/tmp/homepage-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Report image size
        run: ls -lh /tmp/homepage-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-image
          path: /tmp/homepage-image.tar
          retention-days: 2
          if-no-files-found: error

  deploy:
    needs: build
    # Self-hosted runner on the LAN server, running as the `deploy` user.
    runs-on: [self-hosted]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homepage-image
      - name: Load and tag image
        # OCI archives load as an untagged image ID; tag it explicitly.
        # sha-* tags are the local rollback store (see runbook).
        run: |
          LOADED=$(podman load -q -i homepage-image.tar | tail -1 | awk '{print $NF}')
          podman tag "$LOADED" "localhost/homepage:sha-${GITHUB_SHA::7}"
          podman tag "$LOADED" localhost/homepage:latest
      - name: Restart service
        # On EL9 (Notify=healthy) this blocks until the container passes its
        # health check and fails the job on a bad image. Runner jobs have no
        # login session env, hence the explicit XDG_RUNTIME_DIR.
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemctl --user restart homepage.service
      - name: Verify health
        run: |
          for i in $(seq 1 12); do
            curl -fsS http://127.0.0.1:3000/healthz && exit 0
            sleep 5
          done
          echo "service did not become healthy" >&2
          exit 1
      - name: Prune old images
        # Keep the 5 newest sha-* tags for rollback; drop the rest + dangling.
        run: |
          podman images --format '{{.Tag}}' localhost/homepage \
            | { grep '^sha-' || true; } | tail -n +6 \
            | xargs -r -I{} podman rmi "localhost/homepage:{}"
          podman image prune -f >/dev/null
