# Name-based vhost — one app among several on this host. Deliberately NOT
# default_server: each app answers only to its own hostname, so apps never
# fight over who catches unmatched requests (those fall through to the
# distro's stock test page, a useful "server up, wrong hostname" signal).
# Clients resolve homepage.lan via /etc/hosts or LAN DNS.
server {
    listen 80;
    listen [::]:80;
    server_name homepage.lan;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
