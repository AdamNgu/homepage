name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-push:
    # Native arm64 build (no QEMU) — matches the RHEL-family arm64 servers.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Buildx is still required for type=gha layer caching.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-push
    # Self-hosted runner on the LAN server, running as the `deploy` user.
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve image ref
        # GHCR paths are lowercase (metadata-action lowercases the pushed
        # tags), but github.repository preserves the owner's case.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull image
        run: podman pull "$IMAGE"
      - name: Restart service
        # On EL9 (Notify=healthy) this blocks until the container passes its
        # health check and fails the job on a bad image. Runner jobs have no
        # login session env, hence the explicit XDG_RUNTIME_DIR.
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemctl --user restart homepage.service
      - name: Verify health
        run: |
          for i in $(seq 1 12); do
            curl -fsS http://127.0.0.1:3000/healthz && exit 0
            sleep 5
          done
          echo "service did not become healthy" >&2
          exit 1
